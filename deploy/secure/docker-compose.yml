# Secure OpenClaw deployment with Pipelock egress proxy.
#
# Architecture:
#   proxy-net   (internal, no internet) — agents + gateway talk to Pipelock only
#   egress      (external)              — Pipelock reaches the internet
#   host-access (external)              — gateway publishes ports to host
#
# Usage:
#   cp .env.example .env                          # fill in values
#   cp openclaw.example.json .openclaw/openclaw.json  # configure agents
#   docker compose up -d

services:
  # ── Pipelock egress proxy (with GeoIP blocking) ──────────────────────
  pipelock:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    volumes:
      - ./pipelock.yaml:/config/pipelock-base.yaml:ro
      - ./proxy/geo-blocked-countries.conf:/etc/geogate/blocked-countries.conf:ro
      - pipelock-geodb:/var/lib/geogate
      - pipelock-threats:/var/lib/threatfeeds
    networks:
      proxy-net:
        aliases:
          - pipelock
      egress: {}
    restart: unless-stopped

  # ── OpenClaw gateway ───────────────────────────────────────────────
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      # Disable mDNS broadcasting (security hardening)
      OPENCLAW_DISABLE_BONJOUR: "1"
      # Slack Socket Mode tokens
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      # Route sandbox HTTP through Pipelock
      HTTP_PROXY: http://pipelock:8888
      HTTPS_PROXY: http://pipelock:8888
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./.openclaw/workspace}:/home/node/.openclaw/workspace
      # Per-agent workspace isolation
      - ${OPENCLAW_WORKSPACE_WORK_DIR:-./.openclaw/workspace-work}:/home/node/.openclaw/workspace-work
      - ${OPENCLAW_WORKSPACE_PUBLIC_DIR:-./.openclaw/workspace-public}:/home/node/.openclaw/workspace-public
      # Cross-agent shared knowledge (read-only)
      - ./.openclaw/shared-knowledge:/home/node/.openclaw/shared-knowledge:ro
      # ClawSec and custom skills
      - ./skills:/home/node/.openclaw/skills:ro
      # Docker socket for sandbox container spawning
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    networks:
      - proxy-net
      - host-access
    init: true
    restart: unless-stopped
    depends_on:
      pipelock:
        condition: service_healthy
    command:
      [
        "node",
        "openclaw.mjs",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  # ── signal-cli daemon ─────────────────────────────────────────────
  # Java-based signal-cli under Rosetta on Apple Silicon.
  # JSON-RPC API on port 8080 (proxy-net only).
  signal-cli:
    platform: linux/amd64
    build:
      context: ./signal
      dockerfile: Dockerfile
    environment:
      SIGNAL_ACCOUNT: ${SIGNAL_ACCOUNT:-}
      SIGNAL_MODE: ${SIGNAL_MODE:-daemon}
      SIGNAL_CLI_DATA: /data
    volumes:
      - ./.signal-data:/data
    networks:
      proxy-net:
        aliases:
          - signal-cli
      # Direct egress for Signal Protocol (E2E encrypted, no proxy needed)
      egress: {}
    restart: unless-stopped

  # ── OpenClaw CLI (interactive) ─────────────────────────────────────
  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      BROWSER: echo
      HTTP_PROXY: http://pipelock:8888
      HTTPS_PROXY: http://pipelock:8888
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./.openclaw/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_WORKSPACE_WORK_DIR:-./.openclaw/workspace-work}:/home/node/.openclaw/workspace-work
      - ${OPENCLAW_WORKSPACE_PUBLIC_DIR:-./.openclaw/workspace-public}:/home/node/.openclaw/workspace-public
      - ./.openclaw/shared-knowledge:/home/node/.openclaw/shared-knowledge:ro
    networks:
      - proxy-net
    stdin_open: true
    tty: true
    init: true
    depends_on:
      pipelock:
        condition: service_healthy
    entrypoint: ["node", "openclaw.mjs"]
    profiles:
      - cli

networks:
  # Internal network — agents cannot reach the internet directly.
  proxy-net:
    internal: true

  # External network — only Pipelock is attached.
  egress:
    driver: bridge

  # Host-facing network — gateway publishes ports here.
  # Outbound traffic still routes through Pipelock via HTTP_PROXY.
  host-access:
    driver: bridge

volumes:
  # Persists GeoIP data and archive across container restarts
  pipelock-geodb:

  # Persists threat feed cache and archive across container restarts
  pipelock-threats:

