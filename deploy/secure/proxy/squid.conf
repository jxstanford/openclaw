# Squid CONNECT proxy — domain and CIDR-level blocking for sandbox egress.
#
# Runs alongside Pipelock in the same container:
#   Squid  (3128) — HTTPS CONNECT tunnels from sandbox containers
#   Pipelock (8888) — fetch-as-a-service with DLP/prompt-injection scanning
#
# ACL files are generated by generate-squid-acls from Pipelock's merged config.
# No TLS bumping — CONNECT traffic is opaque (Pipelock handles content inspection).

# ── Listener ──────────────────────────────────────────────────────
http_port 3128

# ── ACL definitions ───────────────────────────────────────────────

# Blocked domains (threat feeds + Pipelock blocklist)
acl blocked_domains dstdomain "/etc/squid/acl-blocked-domains.txt"

# Blocked CIDRs (GeoIP + SSRF prevention)
acl blocked_cidrs dst "/etc/squid/acl-blocked-cidrs.txt"

# SSRF prevention — block private/internal ranges
acl localnet dst 0.0.0.0/8
acl localnet dst 127.0.0.0/8
acl localnet dst 10.0.0.0/8
acl localnet dst 172.16.0.0/12
acl localnet dst 192.168.0.0/16
acl localnet dst 169.254.0.0/16
acl localnet dst 100.64.0.0/10
acl localnet dst fc00::/7
acl localnet dst fe80::/10

# Allow CONNECT to standard HTTPS port
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# ── Access rules ──────────────────────────────────────────────────
# Order matters: first match wins.

# Block non-standard ports
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Block known-bad destinations
http_access deny blocked_domains
http_access deny blocked_cidrs
http_access deny localnet

# Allow everything else (balanced mode — matches Pipelock's approach)
http_access allow all

# ── Performance ───────────────────────────────────────────────────
# Disable caching — LLM API responses don't benefit from proxy cache
cache deny all

# ── Logging ───────────────────────────────────────────────────────
# Log to stdout for container log aggregation
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
cache_store_log none

# Compact log format (timestamp, action, status, size, method, URL)
logformat squid_compact %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %un %Sh/%<a %mt

# ── Misc ──────────────────────────────────────────────────────────
# Don't advertise Squid version
httpd_suppress_version_string on

# Forwarded-for header — strip to prevent information leakage
forwarded_for delete

# PID file location
pid_filename /run/squid.pid

# Coredumps directory
coredump_dir /var/spool/squid
